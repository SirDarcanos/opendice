  <rect x="790" y="231" width="262" height="24" rx="3" class="track"/>
  <rect x="790" y="231" width="195.22" height="24" rx="3" class="bar"/>
  <text x="1060" y="248" class="value">8.94×</text>
  <rect x="790" y="279" width="262" height="24" rx="3" class="track"/>
  <rect x="790" y="279" width="153.24" height="24" rx="3" class="bar"/>
